name: deploy
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Rama a desplegar"
        required: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ inputs.branch }}
    steps:
      - name: Validar nombre de rama
        run: |
          echo "Validando: '$BRANCH'"
          if ! printf '%s' "$BRANCH" | grep -qE '^[A-Za-z0-9._/-]+$'; then
            echo "::error::Caracter no permitido en el nombre de rama"
            exit 1
          fi
          case "$BRANCH" in
            *..*) echo "::error::'..' no permitido"; exit 1;;
            -*)   echo "::error::no puede empezar con '-'"; exit 1;;
            /*)   echo "::error::no puede empezar con '/'"; exit 1;;
          esac
          echo "OK: '$BRANCH' es un nombre de rama valido"
      - name: Deploy (resto del job)
        run: echo "Desplegando '$BRANCH'... (simulado, sin secretos)"
